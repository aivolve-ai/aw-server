include /etc/nginx/snippets/cloudflare-realip.conf;
access_log /var/log/nginx/aw-server.access.log;
error_log  /var/log/nginx/aw-server.error.log;
client_max_body_size 50m;

# Admin login (HTTP basic auth) for everything: dashboard, reading data, queries, export, delete.
auth_basic "AIVOLVE Monitor";
auth_basic_user_file /etc/nginx/aw-server.htpasswd;

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header Authorization "";   # the login is checked here, not by aw-server
proxy_read_timeout 120s;

location / {
    proxy_pass http://aw_server;
}

# Watchers on employee PCs cannot log in, so only the calls they make are open:
# server info, create bucket, heartbeat and insert events (POST only; GET/DELETE still need login).
location = /api/0/info {
    auth_basic off;
    proxy_pass http://aw_server;
}
location ~ ^/api/0/buckets/[^/]+/?$ {
    limit_except POST { auth_basic "AIVOLVE Monitor"; auth_basic_user_file /etc/nginx/aw-server.htpasswd; }
    auth_basic off;
    proxy_pass http://aw_server;
}
location ~ ^/api/0/buckets/[^/]+/(heartbeat|events)$ {
    limit_except POST { auth_basic "AIVOLVE Monitor"; auth_basic_user_file /etc/nginx/aw-server.htpasswd; }
    auth_basic off;
    proxy_pass http://aw_server;
}
