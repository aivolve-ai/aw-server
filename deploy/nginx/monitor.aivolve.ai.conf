# aw-server behind nginx. Login (HTTP basic auth) protects both the dashboard and /api.
# Port 80 is served without redirect because ActivityWatch watchers only speak http://.
upstream aw_server { server 127.0.0.1:5600; }

server {
    listen 80;
    listen [::]:80;
    server_name monitor.aivolve.ai;
    location ^~ /.well-known/acme-challenge/ { auth_basic off; root /var/www/certbot; }
    include /etc/nginx/snippets/aw-server-proxy.conf;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name monitor.aivolve.ai;
    ssl_certificate     /etc/letsencrypt/live/monitor.aivolve.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitor.aivolve.ai/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
    include /etc/nginx/snippets/aw-server-proxy.conf;
}
